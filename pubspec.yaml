name: tfh2025
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_painter_v2: ^2.1.0+1
  image: ^4.1.3

  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0


  hooks_riverpod: ^3.0.3
  flutter_hooks:
  riverpod_annotation: ^3.0.3
  freezed_annotation: ^3.0.0
  characters: ^1.3.0
  json_annotation: ^4.9.0
  freezed: ^3.2.3
  go_router: ^17.0.0
  firebase_auth: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  custom_lint:
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/robot.png

  fonts:
    - family: NicomojiPlus
