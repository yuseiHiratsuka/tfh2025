name: Flutter Test

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Test / OS ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # PR HEAD Commitチェックアウト
      - name: Checks-out repo (PR HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # .fvmrc から Flutter バージョン＆チャンネル取得
      - name: Get flutter version & channel from .fvmrc
        uses: kuhnroyal/flutter-fvm-config-action@v3

      # flutter SDK をインストール
      - name: '[CACHE] flutter SDK'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      # pub-cache のみキャッシュ（.dart_tool 等は除外）
      - name: Cache pub deps
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
          key: pubspec-${{ hashFiles('**/pubspec.lock') }}

      # [pubspec dependenciesのキャッシュがない場合] pubspec dependencies をインストール
      - name: Install pubspec dependencies
        run: flutter pub get

      # Flutter test
      - name: Run `flutter test`
        run: flutter test
